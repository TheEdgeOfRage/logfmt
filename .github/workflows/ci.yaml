name: Run CI

on:
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  lint_test:
    name: Linting and tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: "go.mod"

    - name: Run linting
      run: "make lint"

    - name: Run tests
      run: "make test"
